<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="20" fill="#22C55E"/>
  <!-- Atom: nucleus + 3 orbits -->
  <circle cx="100" cy="100" r="14" fill="rgba(255,255,255,0.92)"/>
  <!-- Orbit 1: horizontal ellipse -->
  <ellipse cx="100" cy="100" rx="58" ry="22" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="5"/>
  <!-- Orbit 2: tilted 60° -->
  <ellipse cx="100" cy="100" rx="58" ry="22" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="5" transform="rotate(60,100,100)"/>
  <!-- Orbit 3: tilted 120° -->
  <ellipse cx="100" cy="100" rx="58" ry="22" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="5" transform="rotate(120,100,100)"/>
</svg>
