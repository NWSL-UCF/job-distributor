<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JobDistributor Hub{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='favicon-192.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='hub.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <a class="auth-logo" href="{{ url_for('auth.login') }}">
      <img class="auth-logo__icon" src="{{ url_for('static', filename='favicon.png') }}" width="32" height="32" alt="">
      <span>JobDistributor Hub</span>
    </a>
    {% block auth_content %}{% endblock %}
  </div>
</body>
</html>
