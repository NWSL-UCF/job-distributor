{% extends "auth_base.html" %}
{% block title %}Hub | Reset password{% endblock %}
{% block auth_content %}
<h1 class="auth-title">New password</h1>

<p class="auth-body-text">Enter the reset code from your email and choose a new password.</p>

{% if error %}<p class="alert alert--error">{{ error }}</p>{% endif %}

<form method="post" action="{{ url_for('auth.reset_password') }}">
  <div class="field">
    <label class="field__label">Email</label>
    <input class="field__input" type="email" name="email" required
           value="{{ email or '' }}" {% if email %}readonly{% endif %} autocomplete="email">
  </div>
  <div class="field">
    <label class="field__label">Reset code</label>
    <input class="field__input field__input--otp" type="text" name="otp" required
           inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6"
           placeholder="000000" autofocus autocomplete="one-time-code">
  </div>
  <div class="field">
    <label class="field__label">New password <span class="field__hint">(min 10 characters)</span></label>
    <input class="field__input" type="password" name="password" required minlength="10" autocomplete="new-password">
  </div>
  <div class="field">
    <label class="field__label">Confirm new password</label>
    <input class="field__input" type="password" name="confirm_password" required autocomplete="new-password">
  </div>
  <button type="submit" class="btn btn--primary btn--full">Update password</button>
</form>

<div class="auth-links">
  <a href="{{ url_for('auth.forgot_password') }}">Request a new code</a>
  <span class="auth-links__sep">·</span>
  <a href="{{ url_for('auth.login') }}">Back to sign in</a>
</div>
{% endblock %}
