# frps.toml — FRP Server configuration
#
# frps runs on the hub VPS and:
#   • Accepts tunnel connections from jd_server containers (port 7000)
#   • Exposes experiment HTTP traffic on its vhost port (8080)
#     Nginx then terminates TLS and forwards *.jobdistributor.net → 8080
#
# Install path: /etc/frp/frps.toml
# Binary:       /usr/local/bin/frps
# Systemd unit: deploy/systemd/frps.service

# ── Tunnel listener ───────────────────────────────────────────────────────────
# Port where frpc clients (inside jd_server containers) connect.
# Must be open in your firewall / security group.
bindPort = 7000

# ── Transport TLS ─────────────────────────────────────────────────────────────
# Encrypt all frps ↔ frpc control-plane and data traffic with TLS.
# frp generates a built-in self-signed certificate automatically — no cert
# files need to be provisioned on either side.
# `force = true` means frps will reject any frpc that connects without TLS.
[transport.tls]
force = true

# ── Authentication ────────────────────────────────────────────────────────────
# frp-level token auth is disabled — authentication is fully delegated to the
# Hub's Login plugin hook below, which validates a per-experiment token sent
# in frpc's metadatas.  This means there is no global shared secret that could
# be stolen from a container and reused across experiments.
auth.method = "token"
auth.token  = ""

# ── Virtual-host HTTP port ────────────────────────────────────────────────────
# frps listens here for HTTP requests from Nginx.
# Nginx proxies *.jobdistributor.net → 127.0.0.1:8080.
# Do NOT open port 8080 in your firewall — it must only be reachable from Nginx
# on localhost.
vhostHTTPPort = 8080

# ── Admin API ─────────────────────────────────────────────────────────────────
# The Hub container queries this API to check tunnel status / traffic stats.
# Bind to 0.0.0.0 so the hub container can reach it via the Docker network
# (FRPS_API_URL = http://frps:7500 in hub.env).
# Port 7500 is NOT published to the host in hub-compose.yml, so it is only
# reachable from within the Docker network.
webServer.addr = "0.0.0.0"
webServer.port = 7500

# ── Server Plugin — authentication + proxy authorisation ─────────────────────
# frps calls the Hub for three lifecycle events:
#
#   Login     — frpc client connects.  Hub validates the per-experiment token
#               sent in frpc's metadatas (meta_exp_token).  Clients with an
#               invalid or missing token are rejected before any proxy can be
#               registered.
#
#   NewProxy  — allow HTTP proxies when the experiment token matches and the
#               requested custom_domain belongs to that experiment.
#
#   CloseProxy — frpc tunnel closes.  Hub sends a "server disconnected" email.
#
# Security: port 5000 is never exposed outside the Docker network.
[[httpPlugins]]
name = "hub-auth"
addr = "http://hub:5000"         # hub container on the same Docker network
path = "/api/internal/frp/new-proxy"
ops  = ["Login", "NewProxy", "CloseProxy"]
