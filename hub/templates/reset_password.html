<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — JD Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='hub.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">⬡ JD Hub</div>
    <h1 class="auth-title">New password</h1>

    {% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}

    <form method="post" action="{{ url_for('auth.reset_password') }}">
      <input type="hidden" name="token" value="{{ token }}">
      <div class="field">
        <label class="field__label">New password <span class="field__hint">(min 10 characters)</span></label>
        <input class="field__input" type="password" name="password" required minlength="10" autofocus autocomplete="new-password">
      </div>
      <div class="field">
        <label class="field__label">Confirm new password</label>
        <input class="field__input" type="password" name="confirm_password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn--primary btn--full">Update password</button>
    </form>

    <div class="auth-links">
      <a href="{{ url_for('auth.login') }}">Back to sign in</a>
    </div>
  </div>
</body>
</html>
