# ── Usage ─────────────────────────────────────────────────────────────────────
# Pass the experiment name directly on the command line — no .env editing needed:
#
#   JD_API_KEY=jd_xxx EXP=mnist-v1  docker compose up -d
#   JD_API_KEY=jd_xxx EXP=tuning-01 docker compose up -d
#
# Run multiple experiments on the same machine by using different EXP values.
# Each gets its own container (jd-<EXP>) and workspace folder (./workspace/<EXP>/).
#
# Optional overrides:
#   JD_HUB_URL=https://hub.jobdistributor.net  (default shown)
#
# Prefer ./run.sh for a friendlier CLI:
#   JD_API_KEY=jd_xxx ./run.sh mnist-v1
# ─────────────────────────────────────────────────────────────────────────────

services:
  jd_server:
    image: jobdistributor/jd-server:latest
    container_name: jd-${EXP:?Set EXP=<experiment-name> before running docker compose}
    restart: unless-stopped

    environment:
      - JD_HUB_URL=${JD_HUB_URL:-https://hub.jobdistributor.net}
      - JD_API_KEY=${JD_API_KEY:?Set JD_API_KEY=<your api key>}
      - JD_EXP_NAME=${EXP}

    volumes:
      # Host: ~/jd_server/workspace/<EXP>/  →  Container: /workspace/<EXP>/
      # Job DB, logs, and config are persisted here across container restarts.
      - ./workspace/${EXP}:/workspace/${EXP}
