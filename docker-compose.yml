version: "3.9"

# ── Usage ─────────────────────────────────────────────────────────────────────
# 1. Create an experiment on the Hub and copy your API key from Profile.
# 2. Copy .env.example → .env and fill in JD_API_KEY and JD_EXP_NAME.
# 3. Run:  docker compose up -d
#
# frpc is bundled inside the image — no sidecar needed.
# Workspace data lands at ./workspace/<JD_EXP_NAME>/ on the host.
# ─────────────────────────────────────────────────────────────────────────────

services:
  jd_server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: jd-server:latest
    container_name: jd_server
    restart: unless-stopped

    environment:
      - JD_HUB_URL=${JD_HUB_URL:-https://hub.jobdistributor.net}
      - JD_API_KEY=${JD_API_KEY}
      - JD_EXP_NAME=${JD_EXP_NAME:-my_experiment}

    volumes:
      - ./workspace/${JD_EXP_NAME:-my_experiment}:/workspace/${JD_EXP_NAME:-my_experiment}
