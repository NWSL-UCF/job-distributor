# /etc/nginx/sites-available/jobdistributor.net
#
# Handles three sets of traffic:
#
#   jobdistributor.net            → static marketing landing page
#   hub.jobdistributor.net        → Gunicorn hub app (127.0.0.1:5000)
#   *.jobdistributor.net          → frps vhost HTTP port (127.0.0.1:8080)
#                                   frps routes each Host header to the right
#                                   experiment container via FRP tunnel.
#
# Before enabling this file:
#   1. Obtain a wildcard TLS cert (see deploy/README.md).
#   2. Replace every occurrence of "jobdistributor.net" with your own domain
#      if you are self-hosting under a different name.
#   3. sudo ln -s /etc/nginx/sites-available/jobdistributor.net \
#                 /etc/nginx/sites-enabled/jobdistributor.net
#   4. sudo nginx -t && sudo systemctl reload nginx

# ── WebSocket upgrade map ─────────────────────────────────────────────────────
# Needed so the dashboard SSE / WebSocket connections are passed through cleanly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ── HTTP → HTTPS redirect (all domains) ──────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name jobdistributor.net www.jobdistributor.net
                hub.jobdistributor.net *.jobdistributor.net;

    # Let certbot's HTTP-01 challenges through (used during cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Apex landing page  (jobdistributor.net) ─────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.jobdistributor.net;
    return 301  https://jobdistributor.net$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name jobdistributor.net;

    ssl_certificate     /etc/letsencrypt/live/jobdistributor.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobdistributor.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam           /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;

    root /var/www/jobdistributor-landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Hub web app  (hub.jobdistributor.net) ─────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name hub.jobdistributor.net;

    # Wildcard cert covers hub.jobdistributor.net as well
    ssl_certificate     /etc/letsencrypt/live/jobdistributor.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobdistributor.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large checkpoint / result file uploads (slightly above 100 MB limit)
    client_max_body_size 110M;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;

    # Proxy to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket / SSE support
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        # Buffer tuning for streaming responses (SSE / server-push)
        proxy_buffering    off;
    }

    # Serve static files directly from disk (faster, no Gunicorn round-trip)
    location /static/ {
        alias /opt/hub/hub/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# ── Experiment subdomains  (*.jobdistributor.net) ─────────────────────────────
#
# Every experiment gets two public subdomains:
#   server.<expname>.jobdistributor.net    → job API   (container port 8000)
#   dashboard.<expname>.jobdistributor.net → dashboard (container port 8001)
#
# Nginx forwards all traffic here to frps's vhost HTTP port (8080).
# frps matches the Host header against registered frpc tunnels and proxies
# the request to the correct container — no extra Nginx config needed per
# experiment.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name *.jobdistributor.net;

    ssl_certificate     /etc/letsencrypt/live/jobdistributor.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobdistributor.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large result / checkpoint uploads from workers
    client_max_body_size 110M;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:8080;

        # Must preserve the original Host so frps can route correctly
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket / SSE support (dashboard uses long-lived connections)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # Long timeout so workers can stream checkpoint uploads without interruption
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        proxy_buffering    off;
    }
}
