<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — JD Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='hub.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">⬡ JD Hub</div>
    <h1 class="auth-title">Reset password</h1>

    {% if sent %}
      <div class="alert alert--success">
        If that email is registered, a reset link has been sent. Check your inbox.
      </div>
    {% else %}
      {% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
      <p class="auth-body-text">Enter your email and we'll send you a reset link valid for 1 hour.</p>
      <form method="post" action="{{ url_for('auth.forgot_password') }}">
        <div class="field">
          <label class="field__label">Email</label>
          <input class="field__input" type="email" name="email" required autofocus>
        </div>
        <button type="submit" class="btn btn--primary btn--full">Send reset link</button>
      </form>
    {% endif %}

    <div class="auth-links">
      <a href="{{ url_for('auth.login') }}">Back to sign in</a>
    </div>
  </div>
</body>
</html>
