# Nginx config for the Docker Compose hub stack.
# Proxy targets use Docker service names (hub, frps) instead of localhost.
# TLS settings are inlined — no dependency on certbot's options file.
#
# Mount this file into the nginx container:
#   - ./nginx/hub-docker.conf:/etc/nginx/conf.d/default.conf:ro
#
# TLS: one cert covers apex, hub, and experiment subdomains. Issue with:
#   certbot certonly ... -d "jobdistributor.net" -d "*.jobdistributor.net"
# Files live at /etc/letsencrypt/live/jobdistributor.net/ (see how_to_run/hub.md §4).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ── HTTP → HTTPS ──────────────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name jobdistributor.net www.jobdistributor.net
                hub.jobdistributor.net *.jobdistributor.net;
    return 301  https://$host$request_uri;
}

# ── Apex landing page (jobdistributor.net) ────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.jobdistributor.net;

    ssl_certificate     /etc/letsencrypt/live/jobdistributor.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobdistributor.net/privkey.pem;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301  https://jobdistributor.net$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name jobdistributor.net;

    ssl_certificate     /etc/letsencrypt/live/jobdistributor.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobdistributor.net/privkey.pem;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;

    root /usr/share/nginx/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Hub web app (hub.jobdistributor.net) ──────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name hub.jobdistributor.net;

    # Same wildcard cert as apex + experiment blocks (covers hub.jobdistributor.net)
    ssl_certificate     /etc/letsencrypt/live/jobdistributor.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobdistributor.net/privkey.pem;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;

    client_max_body_size 110M;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;

    location / {
        # Use Docker's internal DNS so nginx resolves "hub" per-request
        # instead of at startup (prevents "host not found" crash-loop).
        resolver 127.0.0.11 valid=30s;
        set $upstream http://hub:5000;
        proxy_pass $upstream;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;
        proxy_buffering    off;
    }
}

# ── Experiment subdomains (*.jobdistributor.net) ──────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name *.jobdistributor.net;

    ssl_certificate     /etc/letsencrypt/live/jobdistributor.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobdistributor.net/privkey.pem;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;

    client_max_body_size 110M;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://frps:8080;
        proxy_pass $upstream;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
        proxy_buffering    off;
    }
}
