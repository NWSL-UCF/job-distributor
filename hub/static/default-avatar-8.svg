<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="20" fill="#EC4899"/>
  <!-- Neural network / graph nodes -->
  <!-- Connections first (behind nodes) -->
  <line x1="100" y1="100" x2="100" y2="52" stroke="rgba(255,255,255,0.55)" stroke-width="3.5"/>
  <line x1="100" y1="100" x2="146" y2="76" stroke="rgba(255,255,255,0.55)" stroke-width="3.5"/>
  <line x1="100" y1="100" x2="146" y2="124" stroke="rgba(255,255,255,0.55)" stroke-width="3.5"/>
  <line x1="100" y1="100" x2="100" y2="148" stroke="rgba(255,255,255,0.55)" stroke-width="3.5"/>
  <line x1="100" y1="100" x2="54" y2="124" stroke="rgba(255,255,255,0.55)" stroke-width="3.5"/>
  <line x1="100" y1="100" x2="54" y2="76" stroke="rgba(255,255,255,0.55)" stroke-width="3.5"/>
  <!-- Outer ring connections -->
  <line x1="100" y1="52" x2="146" y2="76" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="146" y1="76" x2="146" y2="124" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="146" y1="124" x2="100" y2="148" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="100" y1="148" x2="54" y2="124" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="54" y1="124" x2="54" y2="76" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="54" y1="76" x2="100" y2="52" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Center node -->
  <circle cx="100" cy="100" r="16" fill="rgba(255,255,255,0.95)"/>
  <!-- Outer nodes -->
  <circle cx="100" cy="52" r="11" fill="rgba(255,255,255,0.88)"/>
  <circle cx="146" cy="76" r="11" fill="rgba(255,255,255,0.88)"/>
  <circle cx="146" cy="124" r="11" fill="rgba(255,255,255,0.88)"/>
  <circle cx="100" cy="148" r="11" fill="rgba(255,255,255,0.88)"/>
  <circle cx="54" cy="124" r="11" fill="rgba(255,255,255,0.88)"/>
  <circle cx="54" cy="76" r="11" fill="rgba(255,255,255,0.88)"/>
</svg>
